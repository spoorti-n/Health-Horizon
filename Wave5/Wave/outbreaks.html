<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthHorizon.AI - Outbreaks</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Core CSS -->
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body class="dashboard-body">

    <!-- Top Navigation -->
    <nav class="main-nav">
        <a href="index.html" class="nav-link"><i class="fa-solid fa-house"></i> Home</a>
        <a href="dashboard.html" class="nav-link"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
        <a href="outbreaks.html" class="nav-link active"><i class="fa-solid fa-network-wired"></i> Outbreaks</a>
        <a href="alerts.html" class="nav-link"><i class="fa-solid fa-bell"></i> Alerts</a>
        <a href="map.html" class="nav-link"><i class="fa-solid fa-map"></i> Global Map</a>
        <a href="hospital-resource-exchange.html" class="nav-link"><i class="fa-solid fa-hand-holding-medical"></i> Resource Exchange</a>
    </nav>

    <!-- Top Section (Header) -->
    <header class="top-section" style="padding-top: 0;">
        <div class="header-title glass-panel-dark" style="justify-content: center;">
            <i class="fa-solid fa-network-wired text-neon-purple spinner-icon" style="animation: none;"></i>
            <h1 style="font-size: 1.5rem;">AI Symptoms Feed</h1>
            <span class="live-badge">LIVE MONITORING</span>
        </div>
    </header>

    <!-- Main Layout -->
    <main class="dashboard-grid outbreaks-layout-grid" style="padding-top: 1.5rem;">
        
        <!-- Top Full-Width Row: Search Bar -->
        <div class="glass-panel search-panel" style="grid-column: 1 / -1; padding: 1rem 1.5rem; display: flex; align-items: center; gap: 1rem;">
            <i class="fa-solid fa-magnifying-glass text-neon-blue"></i>
            <input type="text" placeholder="Search by Disease, Location, or Keyword..." class="search-input" style="flex: 1; background: transparent; border: none; outline: none; color: #fff; font-family: var(--font-main); font-size: 1rem;">
            <button class="btn btn-primary" style="padding: 0.5rem 1rem;">Search</button>
        </div>

        <!-- Middle Row: Left Map, Right Feed -->
        <div class="glass-panel" style="grid-column: span 8; display: flex; flex-direction: column; height: 350px;">
            <div class="panel-title" style="padding: 1rem 1rem 0.5rem 1rem; margin-bottom: 0;">
                <div class="title-with-icon">
                    <i class="fa-solid fa-earth-americas text-neon-green"></i>
                    <span>Interactive Outbreak Map</span>
                </div>
            </div>
            <div style="flex: 1; position: relative;">
                <div class="map-overlay-grid" style="z-index: 500;"></div>
                <div id="outbreaks-map" style="width: 100%; height: 100%; background: #000; border-radius: 0 0 12px 12px;"></div>
            </div>
        </div>

        <aside class="panel-wrapper glass-panel" style="grid-column: span 4; height: 350px;">
            <div class="panel-title">
                <div class="title-with-icon">
                    <i class="fa-solid fa-network-wired text-neon-purple"></i>
                    <span>AI Symptoms Feed</span>
                </div>
                <div class="pulse-indicator"></div>
            </div>
            <div class="feed-container hidden-scroll" id="symptoms-feed">
                <!-- Cards injected via JS -->
            </div>
        </aside>

        <!-- Middle Row: Table -->
        <div class="glass-panel" style="grid-column: span 12; display: flex; flex-direction: column; padding: 1rem; max-height: 400px;">
            <div class="panel-title">
                <div class="title-with-icon">
                    <i class="fa-solid fa-table text-neon-blue"></i>
                    <span>Active Outbreaks Register</span>
                </div>
            </div>
            <div class="table-container hidden-scroll" style="flex: 1; overflow-y: auto;">
                <table class="data-table" id="outbreaks-table">
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Disease</th>
                            <th>Location</th>
                            <th>Timestamp</th>
                            <th>Risk Score</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Injected via JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Bottom Row: 3 Charts -->
        <div class="glass-panel chart-container" style="grid-column: span 4; padding: 1rem; height: 300px;">
            <div class="panel-title" style="font-size: 0.85rem;"><i class="fa-solid fa-chart-line text-neon-red"></i> Outbreak Trend Graph</div>
            <div class="chart-wrapper"><canvas id="outbreakTrendChart"></canvas></div>
        </div>

        <div class="glass-panel chart-container" style="grid-column: span 4; padding: 1rem; height: 300px;">
            <div class="panel-title" style="font-size: 0.85rem;"><i class="fa-solid fa-magnifying-glass-chart text-neon-yellow"></i> Source Breakdown</div>
            <div class="chart-wrapper"><canvas id="sourceBreakdownChart"></canvas></div>
        </div>

        <div class="glass-panel chart-container" style="grid-column: span 4; padding: 1rem; height: 300px;">
            <div class="panel-title" style="font-size: 0.85rem;"><i class="fa-solid fa-chart-pie text-neon-green"></i> Risk Distribution</div>
            <div class="chart-wrapper"><canvas id="riskDistributionChart"></canvas></div>
        </div>

    </main>

    <!-- Scripts -->
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Chart JS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Core JS -->
    <script src="dashboard.js"></script>
</body>
</html>
