<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthHorizon.AI - Live Map</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Core CSS -->
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body class="dashboard-body">

    <!-- Top Navigation -->
    <nav class="main-nav">
        <a href="index.html" class="nav-link"><i class="fa-solid fa-house"></i> Home</a>
        <a href="dashboard.html" class="nav-link"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
        <a href="outbreaks.html" class="nav-link"><i class="fa-solid fa-network-wired"></i> Outbreaks</a>
        <a href="alerts.html" class="nav-link"><i class="fa-solid fa-bell"></i> Alerts</a>
        <a href="map.html" class="nav-link active"><i class="fa-solid fa-map"></i> Global Map</a>
        <a href="hospital-resource-exchange.html" class="nav-link"><i class="fa-solid fa-hand-holding-medical"></i> Resource Exchange</a>
    </nav>

    <!-- Map Container -->
    <main class="map-page-layout" style="width: 100vw; height: 100vh; padding: 0; display: flex;">
        <section class="map-section" style="flex: 1; border-radius: 0; overflow: hidden; position: relative;">
            <div class="map-overlay-grid"></div>
            <div id="leaflet-map" style="width: 100%; height: 100%; background: #000;"></div>
            <div class="map-status">
                <i class="fa-solid fa-satellite fa-spin text-neon-blue"></i> SAT-LINK ESTABLISHED
            </div>
        </section>
    </main>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://leaflet.github.io/Leaflet.heat/dist/leaflet-heat.js"></script>

    <!-- Core Analytics logic -->
    <script src="dashboard.js"></script>
</body>
</html>
